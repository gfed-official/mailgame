# CI (doc 07 §10): the content validator, the unit tests and the headless smoke, each a job of its
# own so a content error fails fast and says so. Every job runs a stage of tools/ci.sh, which runs
# the same steps on a dev box.
name: CI

on:
  push:
  pull_request:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # The Godot.NET.Sdk version in PerformativeMail.csproj.
  GODOT_VERSION: "4.7.2"

jobs:
  content:
    name: Content validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: tools/ci.sh content

  test:
    name: Sim and Net tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: tools/ci.sh test

  smoke:
    name: Headless smoke
    runs-on: ubuntu-latest
    needs: [content]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Godot (.NET) ${{ env.GODOT_VERSION }}
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-mono-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          mkdir -p ~/godot
          unzip -q /tmp/godot.zip -d ~/godot
      - name: Import the project
        run: |
          godot="$(find ~/godot -name 'Godot_v*_mono_linux.x86_64' -type f | head -1)"
          chmod +x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
          dotnet build PerformativeMail.sln -nodeReuse:false -v quiet -nologo
          # A fresh checkout has no .godot/: import once, headless, before the first run.
          timeout 300 "$godot" --headless --path . --import || true
      - run: tools/ci.sh smoke
