  - name: stackKey
    source: design/gdd/grid-inventory.md
    registered: 2026-10-16
    variables: [mailKind, addressId, flags, itemId]
    expression: "mail: (mailKind, addressId, flags) — Cursed in key, spawn shift not; items: itemId. effMax = Read(MailMaxStack, kind) (= maxStack × stackMult; content-data CD11) evaluated at op time"
    output_range: "effMax 1–80"
    updated: "2026-10-16 (third review: MailMaxStack stat name adopted)"
  - name: sortPacking
    source: design/gdd/grid-inventory.md
    registered: 2026-10-16
    variables: [mode, area, maxDim, districtId, streetId, number, unit, kindIndex, flags, entryId]
    expression: "consolidate oldest-first (chunks with changed contents get new entryIds), then first-fit-decreasing with a total-order comparator (final tiebreak entryId); passes U then R; address mode retries once in size order and replies appliedMode; abort sort_failed on failure; idempotence memo keyed (version, statEpoch) so a sort after Bulk Mailer consolidates"
    updated: "2026-10-16 (third review)"
    output_range: "deterministic placement; ≈ 8 k cell probes for 320 cells with per-shape hints (≈ 205 k naive)"

  - name: holdEff
    source: design/gdd/input-controls.md
    registered: 2026-10-16
    variables: [holdBase, insertPm, holdSetting, holdDefault, holdFloor, holdCeil, minHoldTicks]
    expression: "holdTicks = clamp(ceil(holdBase × (1 − insertPm/1000) × (holdSetting/0.4) × 30), minHoldTicks, ceil(max(holdBase, holdCeil 2.0) × 30)); holdEff = holdTicks/30; holdFloor = minHoldTicks/30 (derived); ONE shared Sim function (PC F4 copy retired), int64, no intermediate truncation; latched at press; counted by Player Character P12 in owning-client Sim ticks"
    output_range: "0.2–2.0 s (6–60 ticks); deliver 0.4 s = 12 ticks at default; 0.8 s base at setting 1.0 = 60 ticks (not clamped); holdSetting is a player setting 0.2–1.0 s"
    updated: "2026-10-16 (design-review revision — holdCeil 1.25 → 2.0, shared function)"
    proposed: true
    referenced_by:
      - design/gdd/player-character-movement.md (F4 holdTicks = this function; PC's own copy retired 2026-10-16 in its design-review revision — OQ-IC-1(f) done)
      - "design/gdd/mail-destinations.md (base manualInsertHold 0.4 s; Quick Hands insertPm 500 on every deliver hold — OQ5 closed by manual-delivery MD9, reconciled 2026-10-16)"
      - design/gdd/manual-delivery.md (F2 deliverHoldTicks restates this function unchanged; Quick Hands insertPm 500 on every deliver hold, StatSheet sum clamped ≤ 750; answers mail-destinations OQ5)
      - design/gdd/building-system.md (B8 deconstruct hold, holdBase 0.5 s)
